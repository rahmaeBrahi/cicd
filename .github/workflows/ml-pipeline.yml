name: ML Model CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r mlops/requirements.txt  

      - name: Linter Check
        run: |
          pip install flake8
          flake8 mlops/ 

      - name: Model Dry Test
        run: |
          python -c "import tensorflow as tf; print('Model environment ready!')"

    
      - name: Upload project documentation
        uses: actions/upload-artifact@v4
        with:
          name: project-doc
          path: mlops/README.md
